<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>jsQuiz12 - React入門（useState）</title>
  <style>
    body {
      padding: 0 16px;
      font-family: sans-serif;
    }

    h1 {
      letter-spacing: 0.08em;
    }

    .like-card {
      max-width: 360px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background: #fff8f8;
      padding: 14px 16px;
    }

    .like-btn {
      border: 1px solid #999;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 1rem;
      background: #fff;
      cursor: pointer;
    }

    .like-label {
      margin: 12px 0 0;
      font-size: 1.05rem;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>TRIDENT いいねカウンター</h1>
  <p>ボタンを押すたびに、いいね数が1ずつ増えます。</p>

  <div id="root"></div>

  <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@19",
        "react/jsx-runtime": "https://esm.sh/react@19/jsx-runtime",
        "react-dom/client": "https://esm.sh/react-dom@19/client"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>

  <script type="text/babel" data-type="module" data-presets="react">
    // ===== 用意済み：React 本体の読み込み（書き換えないこと）=====
    import React, { useState } from 'react';
    import { createRoot } from 'react-dom/client';

    // ===== ここから下があなたの課題です =====

    /* やること：LikeCounter コンポーネントを完成させること。
      useState で likes を管理し、
      1) .like-btn をクリックしたら likes を +1 する
      2) .like-label に「いいね数: {likes}」と表示
      する JSX を return する。

      ■ ヒント
      - ボタンのクリック時に、状態を更新する関数を呼び出す
      - JSX では class ではなく className を使う
      - 数値を表示文に入れるときは中かっこで埋め込む */

    function LikeCounter() {
      const [likes, setLikes] = useState(0);

      // ↓ ここのnullを書き換える（課題）
      return null;
    }

    // ===== ここまでがあなたの課題です =====

    // ===== ここから下は用意済みです（書き換えないこと）=====
    function App() {
      return <LikeCounter />;
    }

    createRoot(document.querySelector('#root')).render(<App />);

    // ----- 自動判定用（書き換えないこと）-----
    window.__quizReadLikesText = () =>
      document.querySelector('.like-label')?.textContent || '';
  </script>
</body>
</html>
